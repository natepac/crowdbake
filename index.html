<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Cg fill='%237ee787'%3E%3Ccircle cx='8.5' cy='11' r='3'/%3E%3Crect x='6' y='14.6' width='5' height='11' rx='2.3'/%3E%3Ccircle cx='23.5' cy='11' r='3'/%3E%3Crect x='21' y='14.6' width='5' height='11' rx='2.3'/%3E%3Cg opacity='.5'%3E%3Ccircle cx='16' cy='8.5' r='2.5'/%3E%3Crect x='13.9' y='11.5' width='4.2' height='9.5' rx='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<title>Instance Baking - VAT crowd</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  body { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e6edf3; }
  canvas { display: block; }

  .hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(13, 17, 23, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 8px; padding: 10px 12px; min-width: 264px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  .hud-graph { display: block; width: 240px; height: 38px; border-radius: 4px; margin-bottom: 8px; }
  .hud-row { display: flex; justify-content: space-between; gap: 12px; }
  .hud-row span:first-child { opacity: 0.62; }
  .hud-big { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .hud-big span:first-child { opacity: 1; }
  .hud-dim { opacity: 0.7; }
  .hud-lods { display: flex; flex-wrap: wrap; gap: 2px 4px; margin-top: 2px; }
  .hud-lods b { font-weight: 500; opacity: 0.62; }
  .hud-lods .sep { opacity: 0.3; margin: 0 2px; }
  .hud-note { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.09); opacity: 0.9; }
  .hud-note:empty { display: none; }
  table.bench { border-collapse: collapse; margin-top: 6px; width: 100%; }
  table.bench th, table.bench td { text-align: right; padding: 1px 6px; }
  table.bench th:first-child, table.bench td:first-child { text-align: left; }
  table.bench th { opacity: 0.55; font-weight: 500; }

  .help {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    background: rgba(13, 17, 23, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 8px; padding: 8px 11px; max-width: 380px;
    opacity: 0.85; pointer-events: none;
  }
  .help b { color: #7ee787; }
  .help kbd {
    background: rgba(255,255,255,0.12); border-radius: 3px; padding: 0 4px;
    border: 1px solid rgba(255,255,255,0.14);
  }

  #crosshair {
    position: fixed; left: 50%; top: 50%; z-index: 15;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    pointer-events: none; display: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.85);
    box-shadow: 0 0 3px rgba(0,0,0,0.8);
  }
  #crosshair::before { left: 12px; top: 2px; width: 2px; height: 22px; }
  #crosshair::after { left: 2px; top: 12px; width: 22px; height: 2px; }

  #loading {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 42%, #16202c 0%, #0d1117 65%);
    transition: opacity .55s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading-inner { text-align: center; width: min(400px, 86vw); }

  /* ------- logo ------- */
  .logo-crowd { display: block; width: 190px; margin: 0 auto 6px; overflow: visible; }
  .logo-crowd .fig { animation: bob 1.15s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }
  .logo-crowd .f1 { animation-delay: 0s; }   .logo-crowd .f2 { animation-delay: .18s; }
  .logo-crowd .f3 { animation-delay: .34s; } .logo-crowd .f4 { animation-delay: .09s; }
  .logo-crowd .f5 { animation-delay: .27s; } .logo-crowd .f6 { animation-delay: .42s; }
  .logo-crowd .f7 { animation-delay: .5s; }
  @keyframes bob { 50% { transform: translateY(-3.5px) scaleY(1.04); } }
  .logo-word {
    font: 800 34px/1.1 system-ui, "Segoe UI", sans-serif; letter-spacing: -0.5px;
    color: #e6edf3; margin-bottom: 3px;
  }
  .logo-word span {
    background: linear-gradient(100deg, #7ee787 10%, #4dd0a4 45%, #58a6ff 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .logo-sub {
    font-size: 11px; letter-spacing: 2.4px; text-transform: uppercase;
    opacity: 0.45; margin-bottom: 26px;
  }

  /* ------- progress ------- */
  #load-track {
    height: 8px; border-radius: 5px; overflow: hidden;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.07);
  }
  #load-fill {
    height: 100%; width: 0%; border-radius: 5px;
    background: linear-gradient(90deg, #f85149, #e3b341, #7ee787, #58a6ff, #bc8cff);
    background-size: 300px 100%;
    transition: width .18s ease;
  }
  #load-track.indet #load-fill {
    width: 40% !important; animation: slide 1.1s ease-in-out infinite alternate;
  }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
  #loading-text {
    opacity: 0.7; margin-top: 12px; min-height: 2.6em; font-size: 12px;
  }
  #loading.error #load-fill { background: #f85149; width: 100% !important; }
  #loading.error #loading-text { opacity: 0.95; }
  #loading code { background: rgba(255,255,255,.09); padding: 1px 5px; border-radius: 3px; }

  .lil-gui { --width: 300px; z-index: 20; }
</style>
</head>
<body>
  <div id="loading"><div id="loading-inner">
    <svg class="logo-crowd" viewBox="0 0 190 56">
      <ellipse cx="95" cy="50" rx="88" ry="4" fill="rgba(255,255,255,0.05)"/>
      <ellipse cx="138" cy="49" rx="17" ry="3.4" fill="#e0559a" opacity="0.85"/>
      <ellipse cx="152" cy="46.5" rx="3.2" ry="1.4" fill="#e0559a" opacity="0.7"/>
      <ellipse cx="126" cy="45.8" rx="2.3" ry="1.1" fill="#58a6ff" opacity="0.7"/>
      <g class="fig f1"><rect x="22" y="26" width="13" height="22" rx="6.5" fill="#4dd0a4"/><circle cx="28.5" cy="20" r="7" fill="#4dd0a4"/><circle cx="26.5" cy="19" r="1.7" fill="#0d1117"/><circle cx="31" cy="19" r="1.7" fill="#0d1117"/></g>
      <g class="fig f2"><rect x="44" y="20" width="15" height="28" rx="7.5" fill="#58a6ff"/><circle cx="51.5" cy="13.5" r="8" fill="#58a6ff"/><circle cx="49" cy="12.5" r="1.9" fill="#0d1117"/><circle cx="54" cy="12.5" r="1.9" fill="#0d1117"/></g>
      <g class="fig f3"><rect x="68" y="30" width="11" height="18" rx="5.5" fill="#e3b341"/><circle cx="73.5" cy="25" r="6" fill="#e3b341"/><circle cx="71.8" cy="24" r="1.5" fill="#0d1117"/><circle cx="75.6" cy="24" r="1.5" fill="#0d1117"/></g>
      <g class="fig f4"><rect x="87" y="23" width="14" height="25" rx="7" fill="#7ee787"/><circle cx="94" cy="16.5" r="7.5" fill="#7ee787"/><circle cx="91.6" cy="15.5" r="1.8" fill="#0d1117"/><circle cx="96.6" cy="15.5" r="1.8" fill="#0d1117"/></g>
      <g class="fig f5"><rect x="110" y="28" width="12" height="20" rx="6" fill="#bc8cff"/><circle cx="116" cy="22" r="6.5" fill="#bc8cff"/><circle cx="114.2" cy="21" r="1.6" fill="#0d1117"/><circle cx="118.2" cy="21" r="1.6" fill="#0d1117"/></g>
      <g class="fig f6"><rect x="131" y="24" width="14" height="24" rx="7" fill="#f0719b"/><circle cx="138" cy="17.5" r="7.5" fill="#f0719b"/><circle cx="135.6" cy="16.5" r="1.8" fill="#0d1117"/><circle cx="140.6" cy="16.5" r="1.8" fill="#0d1117"/></g>
      <g class="fig f7"><rect x="155" y="31" width="10" height="17" rx="5" fill="#f0883e"/><circle cx="160" cy="26.5" r="5.5" fill="#f0883e"/><circle cx="158.5" cy="25.6" r="1.4" fill="#0d1117"/><circle cx="162" cy="25.6" r="1.4" fill="#0d1117"/></g>
    </svg>
    <div class="logo-word">Crowd<span>Bake</span></div>
    <div class="logo-sub">100,000 of anything, animated</div>
    <div id="load-track"><div id="load-fill"></div></div>
    <div id="loading-text">starting...</div>
  </div></div>
  <div id="crosshair"></div>
  <div class="help">
    <b>orbit</b> drag / scroll &nbsp; <b>walk</b> click to lock, <kbd>WASD</kbd> <kbd>Q</kbd><kbd>E</kbd>, <kbd>Shift</kbd> sprint<br>
    <kbd>H</kbd> panel &nbsp; <kbd>M</kbd> metrics &nbsp; <kbd>B</kbd> benchmark &nbsp; <kbd>G</kbd> <b>paint minigun</b> (hold LMB, <kbd>R</kbd> respawns)
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
