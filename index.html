<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Cg fill='%237ee787'%3E%3Ccircle cx='8.5' cy='11' r='3'/%3E%3Crect x='6' y='14.6' width='5' height='11' rx='2.3'/%3E%3Ccircle cx='23.5' cy='11' r='3'/%3E%3Crect x='21' y='14.6' width='5' height='11' rx='2.3'/%3E%3Cg opacity='.5'%3E%3Ccircle cx='16' cy='8.5' r='2.5'/%3E%3Crect x='13.9' y='11.5' width='4.2' height='9.5' rx='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<title>Instance Baking - VAT crowd</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  body { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e6edf3; }
  canvas { display: block; }

  .hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(13, 17, 23, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 8px; padding: 10px 12px; min-width: 264px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  .hud-graph { display: block; width: 240px; height: 38px; border-radius: 4px; margin-bottom: 8px; }
  .hud-row { display: flex; justify-content: space-between; gap: 12px; }
  .hud-row span:first-child { opacity: 0.62; }
  .hud-big { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .hud-big span:first-child { opacity: 1; }
  .hud-dim { opacity: 0.7; }
  .hud-lods { display: flex; flex-wrap: wrap; gap: 2px 4px; margin-top: 2px; }
  .hud-lods b { font-weight: 500; opacity: 0.62; }
  .hud-lods .sep { opacity: 0.3; margin: 0 2px; }
  .hud-note { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.09); opacity: 0.9; }
  .hud-note:empty { display: none; }
  table.bench { border-collapse: collapse; margin-top: 6px; width: 100%; }
  table.bench th, table.bench td { text-align: right; padding: 1px 6px; }
  table.bench th:first-child, table.bench td:first-child { text-align: left; }
  table.bench th { opacity: 0.55; font-weight: 500; }

  .help {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    background: rgba(13, 17, 23, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 8px; padding: 8px 11px; max-width: 380px;
    opacity: 0.85; pointer-events: none;
  }
  .help b { color: #7ee787; }
  .help kbd {
    background: rgba(255,255,255,0.12); border-radius: 3px; padding: 0 4px;
    border: 1px solid rgba(255,255,255,0.14);
  }

  #crosshair {
    position: fixed; left: 50%; top: 50%; z-index: 15;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    pointer-events: none; display: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.85);
    box-shadow: 0 0 3px rgba(0,0,0,0.8);
  }
  #crosshair::before { left: 12px; top: 2px; width: 2px; height: 22px; }
  #crosshair::after { left: 2px; top: 12px; width: 22px; height: 2px; }

  #loading {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: #0d1117; transition: opacity .55s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading-text { opacity: 0.75; text-align: center; max-width: 460px; }
  #loading code { background: rgba(255,255,255,.09); padding: 1px 5px; border-radius: 3px; }
  .lds { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%;
         border: 2px solid rgba(255,255,255,.15); border-top-color: #7ee787;
         animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .lil-gui { --width: 300px; z-index: 20; }
</style>
</head>
<body>
  <div id="loading"><div><div class="lds"></div><div id="loading-text">starting...</div></div></div>
  <div id="crosshair"></div>
  <div class="help">
    <b>orbit</b> drag / scroll &nbsp; <b>walk</b> click to lock, <kbd>WASD</kbd> <kbd>Q</kbd><kbd>E</kbd>, <kbd>Shift</kbd> sprint<br>
    <kbd>H</kbd> toggle panel &nbsp; <kbd>B</kbd> benchmark &nbsp; <kbd>G</kbd> <b>paint minigun</b> (hold LMB, <kbd>R</kbd> respawns)
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
